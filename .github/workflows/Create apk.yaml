name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-


      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
        
      # 4. Build APK
      - name: Build release APK
        run: ./gradlew clean assembleRelease

      # 5. Extract version safely
      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          VERSION_CODE=$(grep "versionCode" app/build.gradle | sed -E 's/[^0-9]*([0-9]+).*/\1/' | head -1)

          echo "Detected versionName=$VERSION_NAME"
          echo "Detected versionCode=$VERSION_CODE"

          # fallback if parsing fails
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="v0.0"
          fi

          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      # 6. Rename APK dynamically
      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mv "$APK" app-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}.apk

      # 7. Upload artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version_name }}
          path: app-release-*.apk
